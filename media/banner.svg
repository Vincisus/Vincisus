<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Vincisus: app gratuite per Windows">
  <style>
    .f{font-family:'Segoe UI Variable Display','Segoe UI',Inter,system-ui,-apple-system,sans-serif}
    .cur{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{0%{fill-opacity:1}50%{fill-opacity:0}}
    .p1,.p2{animation:pulse 2.4s ease-in-out infinite}
    .p2{animation-delay:1.2s}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    @media (prefers-reduced-motion:reduce){.cur,.p1,.p2{animation:none}}
  </style>
  <rect width="1200" height="260" rx="20" fill="#0a0a0a"/>
  <rect x="1" y="1" width="1198" height="258" rx="19" fill="none" stroke="#222" stroke-width="2"/>
  <text x="68" y="92" class="f" font-size="17" fill="#8a8a8a" letter-spacing="2.5">CIAO, SONO</text>
  <text x="64" y="160" class="f" font-size="72" font-weight="700" fill="#fafafa" letter-spacing="-2">Vincisus<tspan class="cur" font-weight="300" fill="#ff7a00" dx="6">_</tspan></text>
  <text x="68" y="206" class="f" font-size="23" fill="#a3a3a3">Faccio app gratuite per Windows, con il codice aperto.</text>

  <g transform="translate(790 70)" class="f">
    <rect width="346" height="54" rx="12" fill="#141414" stroke="#262626" stroke-width="2"/>
    <circle class="p1" cx="28" cy="27" r="7" fill="#ff7a00"/>
    <text x="48" y="34" font-size="20" font-weight="600" fill="#fafafa">ClipTale</text>
    <text x="324" y="34" font-size="16" fill="#8a8a8a" text-anchor="end">Python</text>
    <g transform="translate(0 66)">
      <rect width="346" height="54" rx="12" fill="#141414" stroke="#262626" stroke-width="2"/>
      <circle class="p2" cx="28" cy="27" r="7" fill="#4ade80"/>
      <text x="48" y="34" font-size="20" font-weight="600" fill="#fafafa">MicroMonitor</text>
      <text x="324" y="34" font-size="16" fill="#8a8a8a" text-anchor="end">C#</text>
    </g>
  </g>
</svg>
